name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoservice
          POSTGRES_PASSWORD: autoservice
          POSTGRES_DB: autoservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoservice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run linter
        working-directory: backend
        run: ruff check .

      # Tests use an in-memory SQLite database (see tests/conftest.py).
      - name: Run tests
        working-directory: backend
        run: pytest

      # Migrations are checked against real PostgreSQL: they must apply cleanly
      # and leave no difference between the models and the migrated schema.
      - name: Check migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://autoservice:autoservice@localhost:5432/autoservice
        run: |
          alembic upgrade head
          alembic check

      - name: Build Docker image
        working-directory: backend
        run: docker build -t backend:latest .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t frontend:latest .
